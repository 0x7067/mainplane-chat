display_information:
  name: Mainplane
  description: Drive Mainplane agents from your DMs
features:
  bot_user:
    display_name: Mainplane
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  agent_view:
    agent_description: Drive Mainplane agents
oauth_config:
  scopes:
    bot:
      - assistant:write
      - chat:write
      - im:history
      - channels:history
      - groups:history
      - mpim:history
      - files:read
      - files:write
      - reactions:write
settings:
  socket_mode_enabled: true
  interactivity:
    is_enabled: true
  event_subscriptions:
    bot_events:
      - app_home_opened
      - message.im
      - message.mpim
      - message.groups
      - message.channels
      - agent_session_stopped
      - agent_session_title_changed
  org_deploy_enabled: false
  token_rotation_enabled: false
